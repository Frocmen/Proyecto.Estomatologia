<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta - Dental Health</title>
    <link rel="shortcut icon" href="img/logo.ico">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/VistaUsuario.css">
</head>
<body>

    <button id="logoutBtn" class="btn btn-danger logout-top">Cerrar Sesión</button>

    <div class="container-fluid">
        <div class="row">

            <!-- Sidebar -->
            <div class="col-2 sidebar">
                <h4><span style="font-size:2rem;">🦷</span> Dental Health</h4>
                <div class="menu-item active" onclick="mostrarSeccion('agendar')">
                    <span style="font-size:1.4rem;">📅</span> Agendar Cita
                </div>
                <div class="menu-item" onclick="mostrarSeccion('mis-citas')">
                    <span style="font-size:1.4rem;">📋</span> Mis Citas
                </div>
                <div class="menu-item" onclick="mostrarSeccion('historial')">
                    <span style="font-size:1.4rem;">📖</span> Historial
                </div>
            </div>

            <!-- Contenido Principal -->
            <div class="col-10 main-content">

                <!-- Sección: Agendar Cita -->
                <div id="seccion-agendar" class="seccion">
                    <h2>Agendar Nueva Cita</h2>
                    <div class="card">
                        <form id="formCita">
                            <div class="campo">
                                <label>Servicio deseado:</label>
                                <select id="servicio" required>
                                    <option value="">Seleccione un servicio</option>
                                    <option value="1">Limpieza Dental Profunda</option>
                                    <option value="2">Blanqueamiento Dental</option>
                                    <option value="3">Consulta General</option>
                                    <option value="4">Empaste por Caries</option>
                                    <option value="5">Evaluación de Ortodoncia</option>
                                    <option value="6">Extracción Dental</option>
                                </select>
                            </div>
                            <div class="campo">
                                <label>Profesional:</label>
                                <select id="profesionalId" required>
                                    <option value="">Cargando profesionales...</option>
                                </select>
                            </div>
                            <div class="campo">
                                <label>Fecha deseada:</label>
                                <input type="date" id="fecha" required>
                            </div>
                            <div class="campo">
                                <label>Hora aproximada:</label>
                                <select id="hora" required>
                                    <option value="">Seleccione hora</option>
                                    <option value="09:00">09:00 AM</option>
                                    <option value="10:00">10:00 AM</option>
                                    <option value="11:00">11:00 AM</option>
                                    <option value="14:00">02:00 PM</option>
                                    <option value="15:00">03:00 PM</option>
                                    <option value="16:00">04:00 PM</option>
                                </select>
                            </div>
                            <div class="campo">
                                <label>Comentarios adicionales:</label>
                                <textarea id="comentarios" rows="4" placeholder="Ej: Tengo dolor en una muela..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">Solicitar Cita</button>
                        </form>
                    </div>
                </div>

                <!-- Sección: Mis Citas -->
                <div id="seccion-mis-citas" class="seccion" style="display:none;">
                    <h2>Mis Citas Programadas</h2>
                    <div id="lista-citas">
                        <p class="text-muted">Cargando citas...</p>
                    </div>
                </div>

                <!-- Sección: Historial -->
                <div id="seccion-historial" class="seccion" style="display:none;">
                    <h2>Historial de Atenciones</h2>
                    <div id="lista-historial">
                        <p class="text-muted">Cargando historial...</p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Clínica odontología - @DH</p>
        <p>Todos los derechos reservados al autor</p>
        <div class="social-links">
            <p>Síguenos en:</p>
            <a href="https://www.instagram.com/griseldaestherarcesaavedra/" target="_blank" rel="noopener" aria-label="Instagram">
                <button class="social-button instagram" type="button">
                    <svg class="svg" xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 448 512">

        </div>
    </footer>
