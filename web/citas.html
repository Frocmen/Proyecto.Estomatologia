    <main>
        <div class="contenedor-cita">
            <h2>Agendar Cita</h2>
            <form id="formCita">
                <div class="campo">
                    <label>Nombre completo:</label>
                    <input type="text" id="nombre" placeholder="Ej: Jhonatan López" required>
                </div>
                <div class="campo">
                    <label>Teléfono:</label>
                    <input type="tel" id="telefono" placeholder="987 654 321" required>
                </div>
                <div class="campo">
                    <label>Correo electrónico:</label>
                    <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="campo">
                    <label>Servicio deseado:</label>
                    <select id="servicio" required>
                        <option value="">Seleccione un servicio...</option>
                        <option value="1">Limpieza Dental Profunda</option>
                        <option value="2">Blanqueamiento Dental</option>
                        <option value="3">Consulta General</option>
                        <option value="4">Empaste por Caries</option>
                        <option value="5">Extracción Dental</option>
                        <option value="6">Evaluación de Ortodoncia</option>
                        <option value="7">Revisión y Diagnóstico</option>
                    </select>
                </div>
                <div class="campo">
                    <label>Fecha deseada:</label>
                    <input type="date" id="fecha" required>
                </div>
                <div class="campo">
                    <label>Hora aproximada:</label>
                    <select id="hora" required>
                        <option value="">Seleccione hora...</option>
                        <option value="08:00">08:00 AM</option>
                        <option value="09:00">09:00 AM</option>
                        <option value="10:00">10:00 AM</option>
                        <option value="11:00">11:00 AM</option>
                        <option value="14:00">02:00 PM</option>
                        <option value="15:00">03:00 PM</option>
                        <option value="16:00">04:00 PM</option>
                    </select>
                </div>
                <div class="campo">
                    <label>Comentarios adicionales:<br>Describe tu malestar:</label>
                    <textarea id="comentarios" rows="4" placeholder="Ej: Tengo dolor fuerte, es mi primera vez en la clínica..."></textarea>
                </div>
                <button type="submit" class="btn-accion">Solicitar Cita</button>
            </form>
            <p class="no_account">¿No tienes cuenta? <a href="Registrarse.html">Regístrate aquí</a></p>
        </div>
